# Project-scoped MCP configuration. Enable only after trusting this repository.
[mcp_servers.local-onenote]
enabled = true
command = "uv"
args = ["run", "--locked", "local-onenote-mcp"]
startup_timeout_sec = 120
tool_timeout_sec = 120

[mcp_servers.local-onenote.env]
LOCAL_ONENOTE_MCP_TIMEOUT = "90"
LOCAL_ONENOTE_MCP_MAX_TEXT_CHARS = "60000"
LOCAL_ONENOTE_ENABLE_CREATE = "true"
LOCAL_ONENOTE_ENABLE_WRITES = "true"
LOCAL_ONENOTE_ENABLE_DELETES = "true"
LOCAL_ONENOTE_ENABLE_ORGANIZE = "true"
LOCAL_ONENOTE_ENABLE_LOCAL_FILE_IO = "true"
LOCAL_ONENOTE_ENABLE_UI_CONTROL = "true"
LOCAL_ONENOTE_ENABLE_NOTEBOOK_LIFECYCLE = "true"
# Local, content-free Runtime traces for the trusted work-log-miner profile.
# The directory is intentionally ignored and must remain an existing absolute path.
LOCAL_ONENOTE_MCP_DEBUG_TRACE = "true"
LOCAL_ONENOTE_MCP_DEBUG_DIR = "E:/code/MCP/local-onenote-mcp/.tmp/grok-runtime-debug"
