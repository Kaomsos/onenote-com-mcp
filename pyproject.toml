[project]
name = "local-onenote-mcp"
version = "0.1.0"
description = "Pure-local Microsoft OneNote MCP server backed by the Windows OneNote COM API."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "mcp>=1.26.0,<2.0.0",
    "pydantic>=2.0,<3.0",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Office/Business",
]

[project.urls]
Homepage = "https://github.com/Peteroooooooo/local-onenote-mcp"
Issues = "https://github.com/Peteroooooooo/local-onenote-mcp/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[project.scripts]
local-onenote-mcp = "local_onenote_mcp.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Root conftest initializes this environment variable before pytest's cache
# plugin starts, keeping generated state out of the repository worktree.
cache_dir = "$PYTEST_CACHE_DIR"
# Successful sessions remove tmp_path data; one failed session remains in the
# identity-isolated system-temp root for diagnosis.
tmp_path_retention_policy = "failed"
tmp_path_retention_count = "1"
markers = [
    "write_contract: mocked or isolated tests for tools that mutate OneNote; never run automatically in read-only validation",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
